name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - project-memory/PROJECT_STATE.md
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        id: restore
        continue-on-error: true
        run: dotnet restore MultiAiWorkspace.sln

      - name: Build
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet build MultiAiWorkspace.sln --configuration Release --no-restore

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet test MultiAiWorkspace.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Validate failure-state writer safely
        shell: pwsh
        run: |
          $source = 'project-memory/PROJECT_STATE.md'
          $fixture = Join-Path $env:RUNNER_TEMP 'PROJECT_STATE.failure-fixture.md'
          Copy-Item $source $fixture

          $before = Get-Content $fixture -Raw
          $judgmentPattern = '(?s)\A(.*?)<!-- CI_STATE_START -->'
          $beforeJudgment = [regex]::Match($before, $judgmentPattern).Groups[1].Value

          ./scripts/update-project-state.ps1 `
            -StatePath $fixture `
            -RestoreOutcome 'success' `
            -BuildOutcome 'failure' `
            -TestOutcome 'skipped' `
            -RunId 'failure-validation' `
            -RunUrl 'local-fixture' `
            -CommitSha 'fixture' `
            -UpdatedAtUtc '2000-01-01T00:00:00Z'

          $after = Get-Content $fixture -Raw
          $afterJudgment = [regex]::Match($after, $judgmentPattern).Groups[1].Value

          if ($beforeJudgment -ne $afterJudgment) {
            throw 'Failure-path validation changed ChatGPT-owned judgment fields.'
          }
          if ($after -notmatch 'Build: FAIL') {
            throw 'Failure-path validation did not record Build: FAIL.'
          }
          if ($after -notmatch 'Tests: NOT_RUN') {
            throw 'Failure-path validation did not record Tests: NOT_RUN.'
          }
          if ((Get-Content $source -Raw) -ne $before) {
            throw 'Failure-path validation modified the real PROJECT_STATE.md.'
          }

      - name: Update objective PROJECT_STATE fields
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: pwsh
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Preserve the newest ChatGPT-owned judgment fields before writing CI facts.
          git fetch origin main
          git reset --hard origin/main

          ./scripts/update-project-state.ps1 `
            -StatePath 'project-memory/PROJECT_STATE.md' `
            -RestoreOutcome $env:RESTORE_OUTCOME `
            -BuildOutcome $env:BUILD_OUTCOME `
            -TestOutcome $env:TEST_OUTCOME `
            -RunId $env:RUN_ID `
            -RunUrl $env:RUN_URL `
            -CommitSha $env:COMMIT_SHA

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-memory/PROJECT_STATE.md

          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: update CI project state [skip ci]'
            git push
          }

      - name: Enforce Build/Test result
        if: always()
        shell: pwsh
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          if ($env:RESTORE_OUTCOME -ne 'success' -or $env:BUILD_OUTCOME -ne 'success' -or $env:TEST_OUTCOME -ne 'success') {
            throw "CI failed. Restore=$env:RESTORE_OUTCOME Build=$env:BUILD_OUTCOME Tests=$env:TEST_OUTCOME"
          }
